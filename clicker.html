<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clicker</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --bill: #85bb65;
    --bill-light: #c5e0b0;
    --bill-dark: #4f7a3a;
    --ink: #1f3a1a;
    --pop: #2e7d32;
  }

  * { box-sizing: border-box; margin: 0; }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    font-family: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
    color: var(--pop);
    user-select: none;
    overflow: hidden;
  }

  .game {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2rem;
  }

  /* Score */
  .score {
    font-size: clamp(2.5rem, 8vw, 4.5rem);
    letter-spacing: 0.02em;
    text-shadow: 0 4px 0 var(--ink);
  }
  .score.bump { animation: bump 0.15s ease-out; }

  @keyframes bump {
    50% { transform: scale(1.12); }
  }

  /* The clicker button */
  .clicker {
    position: relative;
    width: clamp(240px, 70vw, 340px);
    aspect-ratio: 2.35;
    border: 5px solid var(--ink);
    border-radius: 10px;
    background:
      radial-gradient(ellipse 22% 42% at 50% 50%, var(--bill-light) 98%, transparent 100%),
      repeating-linear-gradient(45deg, transparent 0 6px, rgba(0,0,0,0.05) 6px 8px),
      var(--bill);
    box-shadow:
      inset 0 0 0 8px var(--bill),
      inset 0 0 0 11px var(--bill-dark),
      0 10px 0 var(--bill-dark),
      0 10px 0 5px var(--ink);
    font: inherit;
    font-size: 3.5rem;
    color: var(--ink);
    cursor: pointer;
    transition: transform 0.06s, box-shadow 0.06s;
  }
  .clicker:hover { filter: brightness(1.05); }
  .clicker:active {
    transform: translateY(8px);
    box-shadow:
      inset 0 0 0 8px var(--bill),
      inset 0 0 0 11px var(--bill-dark),
      0 2px 0 var(--bill-dark),
      0 2px 0 5px var(--ink);
  }
  .clicker:focus-visible {
    outline: 4px dashed var(--ink);
    outline-offset: 10px;
  }

  /* The floating +N text */
  .plus {
    position: fixed;
    pointer-events: none;
    font-size: 2rem;
    color: var(--pop);
    -webkit-text-stroke: 2px var(--ink);
    paint-order: stroke fill;
    text-shadow: 0 3px 0 var(--ink);
    transform: translate(-50%, -50%);
    animation: float-up 0.9s ease-out forwards;
  }

  @keyframes float-up {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
    15%  { opacity: 1; transform: translate(-50%, -70%) scale(1.2); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--drift)), -250%) scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .plus { animation-duration: 0.5s; }
    .score.bump { animation: none; }
  }
</style>
</head>
<body>
  <main class="game">
    <div class="score" id="score">$0</div>
    <button class="clicker" id="clicker" aria-label="Click to earn money">$</button>
  </main>

<script>
  let score = 0;
  let perClick = 1; // change this for upgrades

  const scoreEl = document.getElementById('score');
  const btn = document.getElementById('clicker');

  btn.addEventListener('click', (e) => {
    score += perClick;
    scoreEl.textContent = "$" + score;
    scoreEl.classList.remove('bump');
    void scoreEl.offsetWidth; // restart bump animation
    scoreEl.classList.add('bump');

    // Keyboard clicks have no mouse position, so use the button center
    const r = btn.getBoundingClientRect();
    const x = e.clientX || r.left + r.width / 2;
    const y = e.clientY || r.top + r.height / 2;

    const plus = document.createElement('span');
    plus.className = 'plus';
    plus.textContent = "+$" + perClick;
    plus.style.left = x + 'px';
    plus.style.top = y + 'px';
    plus.style.setProperty('--drift', (Math.random() * 60 - 30) + 'px');
    document.body.appendChild(plus);
    plus.addEventListener('animationend', () => plus.remove());
  });
</script>
</body>
</html>
