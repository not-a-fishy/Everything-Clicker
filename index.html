<!DOCTYPE html>

          <!-- Corner numbers -->
          <text x="22" y="30" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#2f5233">$</text>

          <circle cx="100" cy="60" r="32" fill="#c9e4b5" stroke="#2f5233" stroke-width="2.5"/>
          <text x="100" y="72" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#2f5233" text-anchor="middle">$</text>

        <img src="money.png" width="200" height="50">
